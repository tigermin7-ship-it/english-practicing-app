name: Deploy Main and Dev to GitHub Pages

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch for root (/)
        uses: actions/checkout@v4
        with:
          ref: main
          path: _site

      - name: Remove git metadata from root
        run: rm -rf _site/.git _site/.github

      - name: Checkout dev branch for preview (/dev/)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: dev
          path: _site/dev

      - name: Remove git metadata from /dev/
        run: rm -rf _site/dev/.git _site/dev/.github

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
